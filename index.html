<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学園祭 売上レジシステム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121316;
      --card-bg: #1e2026;
      --card-border: #2e323b;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      
      /* 前売り：紺色 (Navy) */
      --navy-main: #1e3a8a;
      --navy-hover: #1d4ed8;
      --navy-border: #3b82f6;
      
      /* 当日：ワインレッド (Wine Red) */
      --wine-main: #7f1d1d;
      --wine-hover: #991b1b;
      --wine-border: #ef4444;
      
      /* 数量：黒 */
      --qty-bg: #0d0e11;
      --qty-btn-bg: #1a1c23;
      --qty-btn-active: #ffffff;
      
      --accent-color: #38bdf8;
      --danger-color: #f87171;
      --radius-lg: 14px;
      --radius-md: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 12px 40px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .main-container {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ヘッダー */
    .header {
      text-align: center;
      padding: 4px 0;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    /* メインカードUI */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .group-title {
      font-size: 1.05rem;
      font-weight: 900;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.01em;
    }

    .group-title.advance { color: #60a5fa; }
    .group-title.sameday { color: #f87171; }

    /* 商品ボタン */
    .item-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .item-btn {
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      padding: 14px 10px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 105px;
      transition: all 0.1s ease;
    }

    .item-btn:active {
      transform: scale(0.96);
    }

    /* 前売り（紺） */
    .btn-advance {
      background-color: var(--navy-main);
      border-color: var(--navy-border);
    }
    .btn-advance:active {
      background-color: var(--navy-hover);
    }

    /* 当日（ワインレッド） */
    .btn-sameday {
      background-color: var(--wine-main);
      border-color: var(--wine-border);
    }
    .btn-sameday:active {
      background-color: var(--wine-hover);
    }

    .item-btn .price-tag {
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      color: #ffffff;
    }

    .item-btn .item-name {
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      line-height: 1.3;
      margin: 6px 0;
      color: #ffffff;
    }

    /* 黒背景の数量指定エリア */
    .qty-panel {
      background-color: var(--qty-bg);
      border: 1px solid #262932;
      border-radius: var(--radius-md);
      padding: 10px;
    }

    .qty-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .qty-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.05em;
    }

    .qty-indicator {
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--accent-color);
    }

    .qty-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .qty-btn {
      background: var(--qty-btn-bg);
      border: 1px solid #333742;
      border-radius: 6px;
      padding: 10px 0;
      font-size: 1.1rem;
      font-weight: 800;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .qty-btn.active {
      background: var(--qty-btn-active);
      color: #000000;
      border-color: #ffffff;
      font-weight: 900;
    }

    /* 取り消しボタン */
    .undo-btn {
      width: 100%;
      background: #1a1d24;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.1s ease;
    }

    .undo-btn:not(:disabled):active {
      background: #282c37;
    }

    .undo-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 売上集計ボード */
    .dashboard-total {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 12px;
    }

    .dashboard-total .label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .dashboard-total .amount-wrap {
      font-size: 2.4rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      margin-top: 4px;
      letter-spacing: -0.02em;
    }

    .dashboard-total .unit {
      font-size: 1.4rem;
      margin-right: 4px;
      color: var(--text-sub);
    }

    .summary-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #16181d;
      border-radius: 6px;
      border: 1px solid #262932;
    }

    .summary-item .item-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--text-main);
    }

    .summary-item .count-badge {
      font-weight: 800;
      background: #2a2e39;
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--accent-color);
    }

    .summary-item .subtotal {
      font-weight: 800;
      color: #ffffff;
    }

    .admin-buttons {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-secondary {
      background: #2a2e3a;
      color: #ffffff;
      border: 1px solid #3f4454;
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-danger-light {
      background: #2c1517;
      color: var(--danger-color);
      border: 1px solid #5c2427;
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* トースト通知 */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #ffffff;
      color: #000000;
      padding: 12px 24px;
      border-radius: 3
