<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学園祭 売上レジシステム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 明るいライトテーマ */
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #334155;
      --text-sub: #64748b;
      
      /* 前売り：紺色 (Navy) */
      --navy-main: #1e3a8a;
      --navy-hover: #1e40af;
      
      /* 当日：ワインレッド (Wine Red) */
      --wine-main: #881337;
      --wine-hover: #9f1239;
      
      /* 数量選択：黒背景 */
      --qty-bg: #1e293b;
      --qty-btn-bg: #334155;
      --qty-btn-active: #ffffff;
      
      --accent-color: #2563eb;
      --danger-color: #dc2626;
      --radius-lg: 12px;
      --radius-md: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      font-weight: 400; /* 通常の細さに固定 */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 12px 40px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .main-container {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ヘッダー */
    .header {
      text-align: center;
      padding: 4px 0;
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 500;
      color: #0f172a;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #16a34a;
    }

    /* メインカードUI */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .group-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-title.advance { color: var(--navy-main); }
    .group-title.sameday { color: var(--wine-main); }

    /* 商品ボタン */
    .item-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .item-btn {
      border: none;
      border-radius: var(--radius-md);
      padding: 14px 10px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100px;
      transition: background-color 0.15s ease;
    }

    .item-btn:active {
      opacity: 0.9;
    }

    /* 前売り（紺） */
    .btn-advance {
      background-color: var(--navy-main);
    }
    .btn-advance:active {
      background-color: var(--navy-hover);
    }

    /* 当日（ワインレッド） */
    .btn-sameday {
      background-color: var(--wine-main);
    }
    .btn-sameday:active {
      background-color: var(--wine-hover);
    }

    .item-btn .price-tag {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      color: #ffffff;
    }

    .item-btn .item-name {
      font-size: 1.05rem;
      font-weight: 500;
      text-align: center;
      line-height: 1.3;
      margin: 6px 0;
      color: #ffffff;
    }

    /* 黒背景の数量指定エリア */
    .qty-panel {
      background-color: var(--qty-bg);
      border-radius: var(--radius-md);
      padding: 10px;
    }

    .qty-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .qty-label {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .qty-indicator {
      font-size: 0.85rem;
      color: #38bdf8;
    }

    .qty-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .qty-btn {
      background: var(--qty-btn-bg);
      border: none;
      border-radius: 4px;
      padding: 8px 0;
      font-size: 1rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .qty-btn.active {
      background: var(--qty-btn-active);
      color: #0f172a;
      font-weight: 500;
    }

    /* 取り消しボタン */
    .undo-btn {
      width: 100%;
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .undo-btn:not(:disabled):active {
      background: #f1f5f9;
    }

    .undo-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 売上集計ボード */
    .dashboard-total {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 12px;
    }

    .dashboard-total .label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .dashboard-total .amount-wrap {
      font-size: 2.2rem;
      font-weight: 500;
      color: #0f172a;
      line-height: 1.1;
      margin-top: 4px;
    }

    .dashboard-total .unit {
      font-size: 1.3rem;
      margin-right: 4px;
      color: var(--text-sub);
    }

    .summary-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid #f1f5f9;
    }

    .summary-item .item-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .summary-item .count-badge {
      background: #e2e8f0;
      padding: 1px 6px;
      border-radius: 4px;
      color: #334155;
      font-size: 0.8rem;
    }

    .summary-item .subtotal {
      color: #
